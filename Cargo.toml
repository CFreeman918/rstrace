[package]
name = "rstrace"
version = "0.1.0"
edition = "2021"
description = "Offline photo-to-SVG tracer for Shaper Trace style frames"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rfd = { version = "0.18", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2
