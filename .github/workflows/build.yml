name: build

# Every push / PR: build and test on Linux, Windows and macOS, and upload the
# results as workflow artifacts.
# Pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
# additionally publishes a GitHub Release with the downloads attached, but
# only if every platform built and passed its tests and the tag matches the
# version in Cargo.toml.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rstrace-linux-x86_64
          - os: windows-latest
            artifact: rstrace-windows-x86_64
          - os: macos-latest
            artifact: rstrace-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      # Each platform produces one ready-to-download file in dist/.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          # tar keeps the executable bit (zip downloads lose it).
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C target/release rstrace
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/rstrace.exe -DestinationPath dist/${{ matrix.artifact }}.zip
      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          APP=dist/rstrace.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/rstrace "$APP/Contents/MacOS/"
          sed 's/0\.1\.0/${{ steps.version.outputs.version }}/g' assets/Info.plist > "$APP/Contents/Info.plist"
          ICONSET=$(mktemp -d)/rstrace.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-512.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d assets/icon-512.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/rstrace.icns"
          # ditto keeps the bundle intact (permissions, structure).
          (cd dist && ditto -c -k --keepParent rstrace.app ${{ matrix.artifact }}.zip && rm -rf rstrace.app)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}. Bump 'version' in Cargo.toml (and commit) first, or tag v${VERSION}."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          cat > notes.md <<'NOTES'
          ## Downloads

          | System | File | How to run |
          |---|---|---|
          | Linux (x86_64) | `rstrace-linux-x86_64.tar.gz` | `tar -xzf rstrace-linux-x86_64.tar.gz && ./rstrace --install`, then open **rstrace** from your applications menu |
          | Windows (x86_64) | `rstrace-windows-x86_64.zip` | Unzip and run `rstrace.exe` (SmartScreen: *More info → Run anyway*, as it isn't code-signed) |
          | macOS (Apple Silicon) | `rstrace-macos-arm64.zip` | Unzip, run `xattr -cr rstrace.app` once (it isn't code-signed), then open `rstrace.app` |

          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "rstrace $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
